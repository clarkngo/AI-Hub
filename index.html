<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  try {
    var t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Hub</title>
<meta name="description" content="A curated collection of AI projects by Clark Ngo — agents, prompt engineering, embodied AI, and more.">
<link rel="canonical" href="https://clarkngo.github.io/AI-Hub/">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta property="og:title" content="AI Hub">
<meta property="og:description" content="A curated collection of AI projects by Clark Ngo — agents, prompt engineering, embodied AI, and more.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://clarkngo.github.io/AI-Hub/">
<meta property="og:image" content="https://clarkngo.github.io/AI-Hub/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="AI Hub">
<meta name="twitter:description" content="A curated collection of AI projects by Clark Ngo.">
<meta name="twitter:image" content="https://clarkngo.github.io/AI-Hub/og-image.png">
<style>
  :root {
    --bg: #f5f6fa;
    --bg-alt: #ffffff;
    --text: #14151a;
    --text-muted: #5a5d6b;
    --border: #e4e5eb;
    --accent-1: #6d28d9;
    --accent-2: #0d9488;
    --accent-3: #d97706;
    --card-shadow: 0 1px 2px rgba(20,21,26,0.04), 0 8px 24px rgba(20,21,26,0.06);
    --card-shadow-hover: 0 4px 8px rgba(20,21,26,0.06), 0 16px 40px rgba(20,21,26,0.12);
    --focus-ring: #6d28d9;
    --toggle-bg: rgba(20,21,26,0.06);
    --toggle-bg-hover: rgba(20,21,26,0.1);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0f13;
      --bg-alt: #17181f;
      --text: #f2f2f5;
      --text-muted: #9a9ca8;
      --border: #26272f;
      --accent-1: #a78bfa;
      --accent-2: #2dd4bf;
      --accent-3: #fbbf24;
      --card-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
      --card-shadow-hover: 0 4px 8px rgba(0,0,0,0.35), 0 16px 40px rgba(0,0,0,0.5);
      --focus-ring: #a78bfa;
      --toggle-bg: rgba(255,255,255,0.08);
      --toggle-bg-hover: rgba(255,255,255,0.14);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0e0f13;
    --bg-alt: #17181f;
    --text: #f2f2f5;
    --text-muted: #9a9ca8;
    --border: #26272f;
    --accent-1: #a78bfa;
    --accent-2: #2dd4bf;
    --accent-3: #fbbf24;
    --card-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    --card-shadow-hover: 0 4px 8px rgba(0,0,0,0.35), 0 16px 40px rgba(0,0,0,0.5);
    --focus-ring: #a78bfa;
    --toggle-bg: rgba(255,255,255,0.08);
    --toggle-bg-hover: rgba(255,255,255,0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 3px;
  }

  .skip-link {
    position: absolute;
    left: -9999px;
    top: 0;
    background: var(--bg-alt);
    color: var(--text);
    padding: 0.75rem 1.25rem;
    border-radius: 0 0 8px 0;
    z-index: 100;
  }

  .skip-link:focus {
    left: 0;
  }

  .hero {
    position: relative;
    padding: 5.5rem 1.5rem 4rem;
    text-align: center;
    overflow: hidden;
    background:
      radial-gradient(60% 90% at 15% 0%, color-mix(in srgb, var(--accent-1) 22%, transparent), transparent 70%),
      radial-gradient(50% 80% at 90% 10%, color-mix(in srgb, var(--accent-2) 18%, transparent), transparent 70%);
  }

  .theme-toggle {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    width: 2.5rem;
    height: 2.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 999px;
    background: var(--toggle-bg);
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .theme-toggle:hover {
    background: var(--toggle-bg-hover);
  }

  .theme-toggle svg {
    width: 1.15rem;
    height: 1.15rem;
  }

  .eyebrow {
    display: inline-block;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent-2);
    margin-bottom: 1rem;
  }

  .hero h1 {
    margin: 0;
    font-size: clamp(2.5rem, 6vw, 4rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(120deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hero p {
    margin: 1rem auto 0;
    max-width: 34rem;
    font-size: 1.15rem;
    color: var(--text-muted);
  }

  main {
    max-width: 72rem;
    margin: 0 auto;
    padding: 0 1.5rem 5rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1.5rem;
  }

  main > .grid:first-of-type {
    margin-top: -2.5rem;
  }

  .section-title {
    margin: 3.5rem 0 1.25rem;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .load-error {
    text-align: center;
    color: var(--text-muted);
    padding: 3rem 0;
  }

  .card {
    display: flex;
    flex-direction: column;
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--card-shadow);
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    text-decoration: none;
  }

  .card.featured {
    grid-column: 1 / -1;
    flex-direction: row;
  }

  .card.featured .card-icon {
    height: auto;
    width: 12rem;
    flex-shrink: 0;
  }

  .card.featured .card-icon svg {
    width: 3.25rem;
    height: 3.25rem;
  }

  .card.featured .card-title {
    font-size: 1.4rem;
  }

  .card.featured .badge {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--card-accent);
    background: color-mix(in srgb, var(--card-accent) 15%, transparent);
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    margin-bottom: 0.6rem;
  }

  @media (max-width: 640px) {
    .card.featured {
      flex-direction: column;
    }
    .card.featured .card-icon {
      width: auto;
      height: 8rem;
    }
  }

  .card:hover, .card:focus-visible {
    transform: translateY(-6px);
    box-shadow: var(--card-shadow-hover);
    border-color: color-mix(in srgb, var(--card-accent) 40%, var(--border));
  }

  .card-icon {
    height: 8rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, color-mix(in srgb, var(--card-accent) 85%, black 0%), color-mix(in srgb, var(--card-accent) 60%, black 20%));
  }

  .card-icon svg {
    width: 2.75rem;
    height: 2.75rem;
    stroke: white;
  }

  .card-body {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .card-title {
    margin: 0 0 0.5rem;
    font-size: 1.15rem;
    font-weight: 700;
  }

  .card-text {
    margin: 0;
    color: var(--text-muted);
    font-size: 0.95rem;
    line-height: 1.5;
    flex: 1;
  }

  .card-link {
    margin-top: 1.25rem;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--card-accent);
  }

  .card-link svg {
    width: 1rem;
    height: 1rem;
    transition: transform 0.2s ease;
  }

  .card:hover .card-link svg {
    transform: translateX(3px);
  }

  footer {
    text-align: center;
    padding: 2rem 1.5rem 3rem;
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  footer a {
    color: var(--text-muted);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="hero">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle color theme"></button>
    <span class="eyebrow">Clark Ngo</span>
    <h1>AI Hub</h1>
    <p>A curated collection of AI projects — interactive, experimental, and built to make AI more useful.</p>
  </header>

  <main id="main">
    <div id="app"></div>
  </main>

  <footer>
    <p>Built by <a href="https://github.com/clarkngo" target="_blank" rel="noopener">Clark Ngo</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
